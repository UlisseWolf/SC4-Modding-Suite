# Tema "Corporatewave": non il vaporwave malinconico/decadente, ma il suo sottogenere che
# celebra con nostalgia l'ottimismo capitalista degli anni '80-'90 e le sue infomercial —
# carta color crema, oro opaco, verde salvia/teal e mogano da sala riunioni. "Quiet
# opulence", non neon.
#
# Rivisto per un contrasto piu' netto: la prima versione usava toni troppo smorzati/opachi
# (marrone spento, teal polveroso, oro fangoso) che su alcuni schermi si leggevano come un
# grigio scuro poco leggibile. Stessa identita' visiva, colori piu' saturi e un marrone
# quasi-nero per il testo invece del marrone spento originale.

name = "Corporatewave"

