# Tema "Corporatewave": non il vaporwave malinconico/decadente, ma il suo sottogenere che
# celebra con nostalgia l'ottimismo capitalista degli anni '80-'90 e le sue infomercial —
# carta color crema, oro opaco, verde salvia/teal e mogano da sala riunioni. "Quiet
# opulence", non neon.

