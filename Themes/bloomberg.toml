# Tema "Bloomberg Terminal": nero puro con testo ambra.
# Ogni riga e' "chiave = "#RRGGBB"". Puoi copiare questo file, rinominarlo e cambiare i
# colori per creare un tuo tema personalizzato: comparira' automaticamente nel selettore
# tema in Opzioni al prossimo avvio (o riaprendo la finestra Opzioni).
#
# header_background/header_foreground/alternating_row_background/gridlines sono opzionali
# (intestazioni colonna DataGrid, striscia schede non selezionate, righe alternate delle
# griglie, linee divisorie) - se li ometti, l'app usa automaticamente i colori dei pulsanti/
# della lista come prima di questa aggiunta, quindi un tema vecchio senza queste righe
# continua a funzionare identico a prima.

name = "Bloomberg Terminal"

window_background = "#000000"
window_foreground = "#FF9900"
border = "#805000"

button_background = "#000000"
button_foreground = "#FF9900"
button_border = "#FF9900"

textbox_background = "#0A0A0A"
textbox_foreground = "#FFCC33"

selection_background = "#FF9900"
selection_foreground = "#000000"

listbox_background = "#000000"
listboxitem_selected_background = "#332000"

status_foreground = "#33FF66"
danger_foreground = "#FF3333"

header_background = "#1A1000"
header_foreground = "#FFCC33"
alternating_row_background = "#0D0800"
gridlines = "#4D3000"
