# Tema accessibile per l'acromatopsia (assenza totale di visione dei colori - percezione
# solo in scala di grigi). Nessuna coppia di colori puo' funzionare qui: la distinzione tra
# stato positivo e allarme si basa esclusivamente sul CONTRASTO DI LUMINANZA (chiaro contro
# scuro), non sulla tinta - l'unico canale visivo effettivamente disponibile.

