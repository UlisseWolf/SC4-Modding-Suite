name: Release

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.set.outputs.version }}
      file_version: ${{ steps.set.outputs.file_version }}
      release_tag: ${{ steps.set.outputs.release_tag }}
      prerelease: ${{ steps.set.outputs.prerelease }}

    steps:
      - name: Determine version and release tag
        id: set
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tags must match vMAJOR.MINOR.PATCH, for example v0.4.0. Got: $TAG"
              exit 1
            fi
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "file_version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="${GITHUB_SHA:0:7}"
            echo "version=0.0.0-dev.${{ github.run_number }}+$SHORT_SHA" >> "$GITHUB_OUTPUT"
            echo "file_version=0.0.0-dev.${{ github.run_number }}-$SHORT_SHA" >> "$GITHUB_OUTPUT"
            echo "release_tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: Package ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    needs: prepare
    continue-on-error: ${{ matrix.platform.experimental }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            os: windows-latest
            rid: win-x64
            suffix: windows-x64
            experimental: false
          - name: Linux
            os: ubuntu-26.04
            rid: linux-x64
            suffix: linux-x64
            experimental: true
          - name: macOS
            os: macos-latest
            rid: osx-arm64
            suffix: macos-arm64
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/SC4ModdingSuite/SC4ModdingSuite.csproj

      - name: Set archive name
        shell: bash
        run: echo "ARCHIVE=SC4ModdingSuite-${{ needs.prepare.outputs.file_version }}-${{ matrix.platform.suffix }}.zip" >> "$GITHUB_ENV"

      - name: Publish
        run: >
          dotnet publish src/SC4ModdingSuite/SC4ModdingSuite.csproj -c Release
          -r ${{ matrix.platform.rid }}
          --self-contained true
          -p:Version=${{ needs.prepare.outputs.version }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:DebugType=None
          -o publish/${{ matrix.platform.rid }}

      - name: Ad-hoc sign macOS executable
        if: runner.os == 'macOS'
        run: codesign --force --sign - publish/${{ matrix.platform.rid }}/SC4ModdingSuite

      - name: Mark Unix executable bit
        if: runner.os != 'Windows'
        run: chmod +x publish/${{ matrix.platform.rid }}/SC4ModdingSuite

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.platform.rid }}/* -DestinationPath $env:ARCHIVE

      - name: Create Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: (cd publish/${{ matrix.platform.rid }} && zip -r -y "$OLDPWD/$ARCHIVE" .)

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-26.04
    needs: [prepare, package]

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: SC4ModdingSuite-*
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: (cd release-artifacts && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md << 'EOF'
          ## Download

          | Platform | Archive | Status |
          |---|---|---|
          | Windows x64 | `SC4ModdingSuite-<version>-windows-x64.zip` | Primary platform |
          | Linux x64 | `SC4ModdingSuite-<version>-linux-x64.zip` | Experimental |
          | macOS arm64 | `SC4ModdingSuite-<version>-macos-arm64.zip` | Experimental |

          Every archive is a single self-contained executable: no installer and no separate
          .NET installation needed. Verify downloads against `SHA256SUMS.txt`.

          ## Installation

          **Windows:** unzip and run `SC4ModdingSuite.exe`.

          **Linux:** unzip and run `./SC4ModdingSuite` (executable bit already set in the archive).

          **macOS:** Apple Silicon (arm64) only, ad-hoc signed and unnotarized. After unzipping,
          clear the quarantine flag before launching:

          ```sh
          xattr -rd com.apple.quarantine SC4ModdingSuite
          ```

          Keep a backup of any plugin before saving over it.

          ## MCP server

          This build includes a built-in Model Context Protocol server (HTTP, `127.0.0.1` only),
          started/stopped from its own toolbar button inside the app - no separate install or
          process. See the "MCP Server Mode" section of the application README for client setup.

          ## What's changed
          EOF

      - name: Replace rolling release
        if: needs.prepare.outputs.release_tag == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --repo "${{ github.repository }}" --yes --cleanup-tag || true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=()
          if [[ "${{ needs.prepare.outputs.prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG=(--prerelease)
          fi
          gh release create "${{ needs.prepare.outputs.release_tag }}" release-artifacts/* \
            --repo "${{ github.repository }}" \
            --title "${{ needs.prepare.outputs.release_tag == 'latest' && 'Latest (master)' || needs.prepare.outputs.release_tag }}" \
            --notes-file release-notes.md \
            --generate-notes \
            --target "${{ github.sha }}" \
            "${PRERELEASE_FLAG[@]}"
